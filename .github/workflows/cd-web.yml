name: CD - Deploy Web

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "novels.yaml"
      - "config/**"
      - "novel-sources/**"
      - "deploy/k8s/**"
      - ".github/workflows/cd-web.yml"
  workflow_dispatch:

concurrency:
  group: cd-web
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: novel-translator

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify registry secrets
        run: |
          test -n "${{ secrets.OCI_REGISTRY }}" || { echo "OCI_REGISTRY is empty"; exit 1; }
          test -n "${{ secrets.OCI_TENANCY_NAMESPACE }}" || { echo "OCI_TENANCY_NAMESPACE is empty"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Login to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCI_REGISTRY }}
          username: ${{ secrets.OCI_REGISTRY_USERNAME }}
          password: ${{ secrets.OCI_REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # Ampere node needs arm64; keep amd64 so the image stays portable.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.OCI_REGISTRY }}/${{ secrets.OCI_TENANCY_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.OCI_REGISTRY }}/${{ secrets.OCI_TENANCY_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create namespace and secrets via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.K8S_NODE_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            sudo k3s kubectl create namespace novel-translator --dry-run=client -o yaml | sudo k3s kubectl apply -f -
            sudo k3s kubectl create secret generic novel-translator-secrets -n novel-translator \
              --from-literal=base-url='${{ secrets.NOVEL_TRANSLATOR_BASE_URL }}' \
              --from-literal=model='${{ secrets.NOVEL_TRANSLATOR_MODEL }}' \
              --from-literal=api-key='${{ secrets.NOVEL_TRANSLATOR_API_KEY }}' \
              --dry-run=client -o yaml | sudo k3s kubectl apply -f -
            sudo k3s kubectl create secret generic novel-translator-basic-auth -n novel-translator \
              --from-literal=users='${{ secrets.BASIC_AUTH_PASSWD }}' \
              --dry-run=client -o yaml | sudo k3s kubectl apply -f -
            sudo k3s kubectl create secret docker-registry ocir-secret -n novel-translator \
              --docker-server='${{ secrets.OCI_REGISTRY }}' \
              --docker-username='${{ secrets.OCI_REGISTRY_USERNAME }}' \
              --docker-password='${{ secrets.OCI_REGISTRY_PASSWORD }}' \
              --dry-run=client -o yaml | sudo k3s kubectl apply -f -

      - name: Sync manifests via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.K8S_NODE_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          source: deploy/k8s/
          target: /tmp/novel-translator-manifests
          strip_components: 0

      - name: Render and apply manifests via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.K8S_NODE_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            set -o pipefail
            REGISTRY=${{ secrets.OCI_REGISTRY }}
            NAMESPACE=${{ secrets.OCI_TENANCY_NAMESPACE }}
            IMAGE=$REGISTRY/$NAMESPACE/${{ env.IMAGE_NAME }}:${{ github.sha }}
            sudo k3s kubectl kustomize /tmp/novel-translator-manifests/deploy/k8s/ | \
              sed -e "s|<registry>/novel-translator:latest|$IMAGE|g" \
                  -e "s|<registry>|$REGISTRY/$NAMESPACE|g" \
                  -e "s|<host>|${{ secrets.INGRESS_HOST }}|g" | \
              sudo k3s kubectl apply -f -
            rm -rf /tmp/novel-translator-manifests

      - name: Wait for rollout via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.K8S_NODE_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            sudo k3s kubectl rollout status deployment/novel-translator-web -n novel-translator --timeout=300s
