apiVersion: v1
kind: Secret
metadata:
  name: novel-translator-secrets
  namespace: novel-translator
type: Opaque
stringData:
  # Created for real via the CD workflow from GitHub Secrets; values here
  # are placeholders only.
  base-url: "change-me-in-production"
  model: "change-me-in-production"
  api-key: "change-me-in-production"
  # scrypt hash from: python -c "from getpass import getpass;
  #   from novel_translator.web.auth import hash_password;
  #   print(hash_password(getpass()))"
  auth-password-hash: "change-me-in-production"
  # 32+ random chars; rotating it signs every browser out.
  session-secret: "change-me-in-production"
