[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "novel-translator"
version = "0.1.0"
description = "Auditable local CLI for assisted Japanese-to-English novel translation."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.16",
  "fastapi>=0.116",
  "filelock>=3.18",
  "httpx>=0.28",
  "jinja2>=3.1",
  "markdown-it-py>=4.0",
  "openai>=3.6.0",
  "pydantic>=2.11",
  "python-dotenv>=1.2.3",
  "python-multipart>=0.0.20",
  "PyYAML>=6.0",
  "sqlalchemy>=2.0",
  "typer>=0.16",
  "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.131",
  "pytest>=8.4",
  "ruff>=0.12",
]

[project.scripts]
novel-translator = "novel_translator.cli.app:main"
novel-translator-web = "novel_translator.web.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_translator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: exercises filesystem or command boundaries"]

[tool.ruff]
line-length = 79
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
include = ["src"]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pyright>=1.1.411",
]
