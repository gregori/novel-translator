<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Novel Translator{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <a class="home" href="/">Novel Translator</a>
      <span class="tagline">Editorial reading room</span>
      <nav class="topnav">
        <a href="/translate">Translate</a>
        <a href="/translate/jobs">Jobs</a>
      </nav>
      <form class="logout" method="post" action="/logout">
        <button class="btn-quiet secondary" type="submit">Sign out</button>
      </form>
    </header>
    <main class="sheet">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
